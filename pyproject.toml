[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "energy-market-analytics-lakehouse"
version = "0.1.0"
description = "Databricks lakehouse for historical and near-real-time energy-market analytics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pyspark>=3.5,<4",
  "delta-spark>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
energy-lakehouse = "energy_market_lakehouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_market_lakehouse"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["spark: requires a local Spark runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
