resources:
  jobs:
    energy_market_sample_pipeline:
      name: Energy Market Sample Pipeline
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
        - task_key: bronze
          depends_on: [{task_key: setup}]
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/03_gold.py
        - task_key: validate
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../notebooks/04_validate.py
